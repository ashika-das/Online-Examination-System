<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Java Examination</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="exam-container">

    <h1>Java Programming Exam</h1>

    <h3 id="timer">Time: 05:00</h3>

    <form id="examForm">

        <div class="question">

            <p>1. What is JVM?</p>

            <label>
                <input type="radio"
                       name="q1"
                       value="correct">
                Java Virtual Machine
            </label>

            <label>
                <input type="radio"
                       name="q1"
                       value="wrong">
                Java Variable Machine
            </label>

            <label>
                <input type="radio"
                       name="q1"
                       value="wrong">
                Java Version Machine
            </label>

        </div>


        <div class="question">

            <p>2. Which keyword is used to create a class in Java?</p>

            <label>
                <input type="radio"
                       name="q2"
                       value="correct">
                class
            </label>

            <label>
                <input type="radio"
                       name="q2"
                       value="wrong">
                ClassName
            </label>

            <label>
                <input type="radio"
                       name="q2"
                       value="wrong">
                create
            </label>

        </div>


        <div class="question">

            <p>3. Which method is the starting point of a Java program?</p>

            <label>
                <input type="radio"
                       name="q3"
                       value="correct">
                main()
            </label>

            <label>
                <input type="radio"
                       name="q3"
                       value="wrong">
                start()
            </label>

            <label>
                <input type="radio"
                       name="q3"
                       value="wrong">
                run()
            </label>

        </div>


        <div class="question">

            <p>4. Which data type stores true or false?</p>

            <label>
                <input type="radio"
                       name="q4"
                       value="correct">
                boolean
            </label>

            <label>
                <input type="radio"
                       name="q4"
                       value="wrong">
                int
            </label>

            <label>
                <input type="radio"
                       name="q4"
                       value="wrong">
                String
            </label>

        </div>


        <div class="question">

            <p>5. Which symbol is used to end a Java statement?</p>

            <label>
                <input type="radio"
                       name="q5"
                       value="correct">
                ;
            </label>

            <label>
                <input type="radio"
                       name="q5"
                       value="wrong">
                :
            </label>

            <label>
                <input type="radio"
                       name="q5"
                       value="wrong">
                .
            </label>

        </div>

        <button type="submit">Submit Exam</button>

    </form>

</div>

<script src="js/exam.js"></script>

</body>
</html>
